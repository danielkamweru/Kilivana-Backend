# Render deployment for the Kilivana backend.
#
# The service is a plain Java/Spring Boot application: Render builds the
# JAR with Maven and runs it. PostgreSQL is a separate Render service;
# Render injects its connection string as DATABASE_URL, which the
# application translates into the datasource settings at startup.
#
# See README.md for the full deployment walkthrough and every
# environment variable.
services:
  - type: web
    name: kilivana-backend
    # Built from the Dockerfile in the repository root.
    env: docker
    region: oregon
    healthCheckPath: /api/v1/health
    plan: free
    envVars:
      # The attached PostgreSQL service owns this value; it is a full
      # postgres:// URL that the app translates at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: kilivana-postgres
          property: databaseUrl
      # Stable signing key so issued JWTs survive a restart. Render
      # generates and stores the value.
      - key: JWT_SECRET
        generateValue: true
      # Finite token lifetime in a shared environment.
      - key: JWT_EXPIRATION
        value: "86400000"
      # Browser clients may call the API from any origin. Safe
      # here because the app uses allowed origin patterns, which
      # support "*" together with credentials. Restrict to a
      # comma-separated list of frontend hostnames for a locked
      # deployment. Native clients (Android/iOS) ignore CORS.
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      # Absolute URL the API advertises in Swagger and image links.
      # This is the service's live hostname on Render.
      - key: PUBLIC_BASE_URL
        value: https://kilivana-backend-a44w.onrender.com
      # Populate the database with the Kenyan demo data on first boot.
      # Set to false once the data you want is in place.
      - key: SEED_DATA
        value: "true"
      - key: SEED_ADMIN_EMAIL
        value: admin@kilivana.com
      # Initial administrator's password, committed so a fresh
      # deploy from this file alone creates the admin account.
      # For a locked deployment, remove this value and set it
      # as a Render dashboard secret (SEED_ADMIN_PASSWORD) instead.
      - key: SEED_ADMIN_PASSWORD
        value: "Admin@123"
      # Demo (non-admin) accounts share this password; change it before
      # anyone but you uses the deployment.
      - key: SEED_DEMO_PASSWORD
        value: "Kilivana#2026"
      # Keep the seeded accounts' passwords equal to the values
      # above, so a redeploy always leaves the documented logins
      # working. Intended for the demo deployment; leave false in
      # production.
      - key: SEED_ENFORCE_PASSWORDS
        value: "true"
      # The Render filesystem is ephemeral, so uploaded images live in
      # PostgreSQL. Switch to cloudinary only when the CLOUDINARY_*
      # secrets are configured.
      - key: STORAGE_PROVIDER
        value: database
      # Swagger stays on so the deployment documents itself; turn it off
      # with a false value when it is no longer wanted.
      - key: SWAGGER_ENABLED
        value: "true"
      - key: API_DOCS_ENABLED
        value: "true"

# Render Blueprint for the Kilivana Spring Boot API and its PostgreSQL database.
# Import this file from Render's Blueprint page after pushing it to your Git repo.
services:
  - type: web
    name: kilivana-backend
    runtime: docker
    region: oregon
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      # Render Postgres exposes an internal connection string. The application
      # converts it to Spring datasource properties at startup.
      - key: DATABASE_URL
        fromDatabase:
          name: kilivana-postgres
          property: connectionString

      # Render creates these once and retains them across subsequent syncs.
      - key: JWT_SECRET
        generateValue: true
      - key: EMAIL_OTP_HMAC_SECRET
        generateValue: true

      # Keeps OpenAPI, image URLs, and the default Daraja callback aligned with
      # the Render URL (or a replacement custom domain) without hard-coding it.
      - key: PUBLIC_BACKEND_URL
        fromService:
          name: kilivana-backend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

      # Restrict this to the HTTPS origins of the deployed web clients when
      # creating the Blueprint. It is intentionally not committed as '*'.
      - key: CORS_ALLOWED_ORIGINS
        sync: false

      # The defaults below avoid demo data and local-file uploads on Render's
      # ephemeral filesystem. Add integration credentials in the Render UI.
      - key: SEED_DATA
        value: "false"
      - key: STORAGE_PROVIDER
        value: database
      - key: SWAGGER_ENABLED
        value: "true"
      - key: API_DOCS_ENABLED
        value: "true"

databases:
  - name: kilivana-postgres
    region: oregon
    databaseName: kilivana
    user: kilivana_user

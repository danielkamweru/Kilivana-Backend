# Server Configuration
server.port=${SERVER_PORT:8080}
spring.application.name=kilivana-backend

# Database Configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/kilivana}
spring.datasource.username=${DB_USERNAME:kilivana_user}
spring.datasource.password=${DB_PASSWORD:daniel kamweru}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
# Set JWT_SECRET to a stable Base64 or raw value of at least 32 bytes.
# When unset the app generates an ephemeral key at startup and logs a warning,
# which invalidates every previously issued token on restart.
#
# Expiration is in milliseconds. A value of 0 issues tokens with no expiry, so
# they remain valid until the signing secret changes. That is convenient for local
# development but means a leaked token cannot be revoked individually; set a
# finite JWT_EXPIRATION for any shared or deployed environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=${JWT_EXPIRATION:0}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:0}

# Public base URL advertised in Swagger (set this to your tunnel origin so
# "Try it out" calls the public host). Left blank, only localhost is listed.
app.public-base-url=${PUBLIC_BASE_URL:}

# Local development accounts (admin/farmer/buyer/supplier/driver/inspector).
# Creates known-password accounts: enable for local work only, never in a deployment.
app.dev-seed.enabled=${DEV_SEED_ENABLED:true}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
# The list is comma separated and may contain wildcard patterns, because ngrok
# free tunnels are reassigned on every restart. Keep this default in step with the
# fallback in CorsConfig: a value here always overrides the @Value default, so a
# narrower list here silently wins.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,https://*.ngrok-free.dev,https://*.ngrok.app}

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=when-authorized

# OpenAPI/Swagger Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
# Image Storage Configuration
# provider = local      files on disk under app.storage.local.directory, served from /uploads/**
# provider = database   image bytes stored as bytea in PostgreSQL, served from /api/v1/images/{id}
# provider = cloudinary Cloudinary, requires the CLOUDINARY_* values below
app.storage.provider=${STORAGE_PROVIDER:local}
app.storage.local.directory=${STORAGE_LOCAL_DIRECTORY:./uploads}
# Absolute base the API uses when it builds image URLs. Set this to the public https
# address (for example the ngrok tunnel URL) so clients never receive an http:// URL.
app.public-base-url=${PUBLIC_BASE_URL:}

# Cloudinary Configuration (used only when app.storage.provider=cloudinary)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SendGrid Configuration
# The API key is read from the environment only. Never commit a real key here.
app.sendgrid.enabled=${SENDGRID_ENABLED:false}
app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:no-reply@kilivana.com}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:Kilivana}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.kilivana.backend=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

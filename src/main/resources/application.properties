# Server Configuration
# Render provides PORT; the application listens on it.
server.port=${PORT:8080}
spring.application.name=kilivana-backend

# Database Configuration
# On Render, DATABASE_URL is provided by the attached PostgreSQL service and is
# translated into the datasource settings by DatabaseUrlEnvironmentPostProcessor.
# Locally, set DB_URL / DB_USERNAME / DB_PASSWORD instead. No credentials are
# committed: unset values simply fail to connect, which is the safe default.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/kilivana}
spring.datasource.username=${DB_USERNAME:}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
# Set JWT_SECRET to a stable Base64 or raw value of at least 32 bytes.
# When unset the app generates an ephemeral key at startup and logs a warning,
# which invalidates every previously issued token on restart. Deployments must
# set a stable secret.
#
# Expiration is in milliseconds. A value of 0 issues tokens with no expiry, so
# they remain valid until the signing secret changes. That is convenient for local
# development but means a leaked token cannot be revoked individually; set a
# finite JWT_EXPIRATION for any shared or deployed environment.
app.jwt.secret=${JWT_SECRET:}
app.jwt.access-token-expiration=${JWT_EXPIRATION:0}
app.jwt.refresh-token-expiration=${JWT_REFRESH_EXPIRATION:0}

# Public base URL advertised in Swagger and used when the API builds absolute
# image URLs. Set this to the deployed service origin (for example
# https://kilivana-backend.onrender.com) so clients never receive an http:// URL.
# Left blank, Swagger "Try it out" calls whatever host the UI was opened from.
app.public-base-url=${PUBLIC_BASE_URL:}

# Demo/seed data. Disabled by default so a deployment opens empty unless the
# operator opts in; enable on Render with SEED_DATA=true. The initial admin
# account uses SEED_ADMIN_EMAIL / SEED_ADMIN_PASSWORD, which must be supplied -
# no password is ever committed. The remaining demo accounts share
# SEED_DEMO_PASSWORD, documented in the README.
app.seed.enabled=${SEED_DATA:false}
app.seed.admin-email=${SEED_ADMIN_EMAIL:admin@kilivana.com}
app.seed.admin-password=${SEED_ADMIN_PASSWORD:}
app.seed.demo-password=${SEED_DEMO_PASSWORD:Kilivana#2026}
# Reset a seeded account's password to the configured value when it
# no longer matches. Off by default so a production deploy never
# changes a password; on for a demo environment whose seeded accounts
# are the intended logins.
app.seed.enforce-passwords=${SEED_ENFORCE_PASSWORDS:false}

# JPA/Hibernate Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
# The list is comma separated and may contain wildcard patterns. The default
# covers local development servers only; a deployment sets
# CORS_ALLOWED_ORIGINS to the frontend's origin (for example
# https://kilivana-admin.onrender.com). Do not ship a wildcard origin to a
# shared environment: the API accepts credentials, so a wildcard origin is an
# open door to any site.
# Allow every browser origin by default. The app uses allowed origin
# patterns, so "*" works together with credentials. A deployment can
# lock this down to a comma-separated list via CORS_ALLOWED_ORIGINS.
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Actuator Configuration
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info}
management.endpoint.health.show-details=when-authorized

# OpenAPI/Swagger Configuration
# Both are enabled by default so the deployed service documents itself; set
# SWAGGER_ENABLED=false (or API_DOCS_ENABLED=false) to turn either off later.
springdoc.api-docs.path=/api-docs
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Image Storage Configuration
# provider = local      files on disk under app.storage.local.directory, served from /uploads/**
# provider = database   image bytes stored as bytea in PostgreSQL, served from /api/v1/images/{id}
# provider = cloudinary Cloudinary, requires the CLOUDINARY_* values below
# The default is "database" because a Render filesystem is ephemeral: files
# written to disk there are lost on every restart. Set STORAGE_PROVIDER=local
# only for a filesystem that is actually persistent.
app.storage.provider=${STORAGE_PROVIDER:database}
app.storage.local.directory=${STORAGE_LOCAL_DIRECTORY:./uploads}
# When the provider is cloudinary, an unconfigured or failing Cloudinary upload is stored in
# PostgreSQL instead of failing the request. Set to "none" to fail hard on Cloudinary errors.
app.storage.fallback-provider=${STORAGE_FALLBACK_PROVIDER:database}

# Cloudinary Configuration (used only when app.storage.provider=cloudinary)
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SendGrid Configuration
# The API key is read from the environment only. Never commit a real key here.
# Disabled by default: the backend starts and logs delivery codes without it.
app.sendgrid.enabled=${SENDGRID_ENABLED:false}
app.sendgrid.api-key=${SENDGRID_API_KEY:}
app.sendgrid.from-email=${SENDGRID_FROM_EMAIL:no-reply@kilivana.com}
app.sendgrid.from-name=${SENDGRID_FROM_NAME:Kilivana}

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.com.kilivana.backend=INFO
logging.level.org.springframework.web=INFO
